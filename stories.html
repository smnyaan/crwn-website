  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Rough-edge filter for headlines: warps the glyph outlines themselves
       (not a texture drawn over them) for a hand-stamped look. -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <filter id="rough-edge" x="-20%" y="-40%" width="140%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.3333333432674408 0.3333333432674408" numOctaves="3" seed="2028" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
